<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Record</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      line-height: 1.5;
      padding: 2rem 1rem;
    }
    .form-container {
      max-width: 860px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      overflow: hidden;
    }
    .form-header {
      background: #1e3a5f;
      color: #fff;
      padding: 1.5rem 2rem;
    }
    .form-header h1 { font-size: 1.5rem; font-weight: 600; overflow-wrap: anywhere; }
    .form-header p { opacity: .85; font-size: .9rem; margin-top: .25rem; }
    .header-top {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: .9rem;
    }
    .back {
      flex: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,.16);
      display: grid;
      place-items: center;
    }
    .back:hover { background: rgba(255,255,255,.28); }
    .back:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .back svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .meta { display: flex; flex-wrap: wrap; gap: .25rem 1.5rem; }
    form { padding: 2rem; }
    .section { margin-bottom: 2rem; }
    .section-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #1e3a5f;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: .5rem;
      margin-bottom: 1.25rem;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.25rem; }
    .full { grid-column: 1 / -1; }
    label {
      display: block;
      font-size: .85rem;
      font-weight: 500;
      color: #4a5568;
      margin-bottom: .35rem;
    }
    label .req { color: #e53e3e; }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: .6rem .75rem;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: .95rem;
      background: #fff;
      transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49,130,206,.15);
    }
    textarea { resize: vertical; min-height: 80px; }
    .nok-card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      background: #f7fafc;
    }
    .nok-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .nok-card h3 { font-size: .95rem; color: #2d3748; }
    label.check {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .9rem;
      color: #2d3748;
      margin: 0;
    }
    label.check input { width: 18px; height: 18px; }
    .message {
      margin: 1rem 0;
      padding: .75rem 1rem;
      border-radius: 6px;
      font-size: .9rem;
    }
    .message.error { background: #fed7d7; color: #9b2c2c; }
    .message.ok { background: #c6f6d5; color: #276749; }
    .actions {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
      padding-top: 1.5rem;
      border-top: 1px solid #e2e8f0;
    }
    button, a.btn-secondary {
      padding: .7rem 1.5rem;
      border-radius: 6px;
      font-size: .95rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
    }
    a.btn-secondary { display: inline-block; text-decoration: none; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    button.nok-remove {
      padding: .3rem .6rem;
      background: none;
      color: #c53030;
      font-size: .85rem;
    }
    button.nok-remove:hover { background: #fff5f5; }
    .btn-primary { background: #1e3a5f; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #16304f; }
    .btn-secondary { background: #edf2f7; color: #2d3748; }
    .btn-secondary:hover { background: #e2e8f0; }
    @media (max-width: 640px) {
      .grid, .grid-3 { grid-template-columns: 1fr; }
      .form-header { padding: 1.25rem 1.25rem; }
      form { padding: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="form-header">
      <div class="header-top">
        <a class="back" href="PatientList.html" aria-label="Back to patient list" title="Back to patient list">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
        </a>
        <img class="logo" src="/Images/Logo.png" alt="Logo" style="height: 72px;">
      </div>

      <h1 id="pageTitle">Patient information</h1>
      <p class="meta" id="patientMeta" hidden>
        <span>Patient number <strong id="patientNumber"></strong></span>
        <span>Age <strong id="patientAge"></strong></span>
      </p>
    </div>
    <form id="patientForm">
      <div id="load-message" class="message" role="alert" hidden></div>

      <!-- Personal Details -->
      <div class="section">
        <div class="section-title">Personal Details</div>
        <div class="grid">
          <div class="full">
            <label>Full Name <span class="req">*</span></label>
            <input type="text" name="fullName" required maxlength="150">
          </div>
          <div class="full">
            <label>Previous Name</label>
            <input type="text" name="previousName" maxlength="150">
          </div>
          <div>
            <label>Date of Birth <span class="req">*</span></label>
            <input type="date" name="dateOfBirth" required>
          </div>
          <div>
            <label>Sex <span class="req">*</span></label>
            <select name="sex" required>
              <option value="">Select…</option>
              <option value="MALE">Male</option>
              <option value="FEMALE">Female</option>
              <option value="OTHER">Other</option>
              <option value="UNKNOWN">Prefer not to say</option>
            </select>
          </div>
          <div>
            <label>Nationality</label>
            <input type="text" name="nationality" maxlength="80">
          </div>
          <div>
            <label>State of Origin</label>
            <input type="text" name="stateOfOrigin" maxlength="80">
          </div>
          <div>
            <label>Marital Status</label>
            <select name="maritalStatus">
              <option value="">Select…</option>
              <option value="SINGLE">Single</option>
              <option value="MARRIED">Married</option>
              <option value="DIVORCED">Divorced</option>
              <option value="SEPARATED">Separated</option>
              <option value="WIDOWED">Widowed</option>
              <option value="OTHER">Other</option>
            </select>
          </div>
          <div>
            <label>Occupation</label>
            <input type="text" name="occupation" maxlength="100">
          </div>
          <div>
            <label>Education Level</label>
            <select name="educationLevel">
              <option value="">Select…</option>
              <option value="NONE">None</option>
              <option value="PRIMARY">Primary</option>
              <option value="SECONDARY">Secondary</option>
              <option value="TERTIARY">Tertiary</option>
              <option value="POSTGRADUATE">Postgraduate</option>
              <option value="OTHER">Other</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Contact -->
      <div class="section">
        <div class="section-title">Contact Information</div>
        <div class="grid">
          <div class="full">
            <label>Residential Address</label>
            <textarea name="residentialAddress" maxlength="300"></textarea>
          </div>
          <div>
            <label>Phone Number <span class="req">*</span></label>
            <input type="tel" name="phoneNumber" required maxlength="20" placeholder="+61 …"
                   pattern="\+?[0-9 \(\)\-]{7,20}"
                   title="7 to 20 digits. Spaces, brackets and hyphens are fine, and a leading + is allowed.">
          </div>
          <div>
            <label>Email Address</label>
            <input type="email" name="emailAddress" maxlength="150">
          </div>
          <div>
            <label>Preferred Language</label>
            <input type="text" name="preferredLanguage" maxlength="50">
          </div>
          <div>
            <label>Preferred Communication Method</label>
            <select name="preferredCommunicationMethod">
              <option value="">Select…</option>
              <option value="PHONE_CALL">Phone call</option>
              <option value="SMS">SMS</option>
              <option value="WHATSAPP">WhatsApp</option>
              <option value="EMAIL">Email</option>
              <option value="IN_PERSON">In person</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Next of Kin -->
      <div class="section">
        <div class="section-title">Next of Kin</div>
        <div id="nokList"></div>
        <button type="button" class="btn-secondary" id="addNok">+ Add contact</button>
      </div>

      <!-- Case worker: admins only -->
      <div class="section" id="caseWorkerSection" hidden>
        <div class="section-title">Case Worker</div>
        <div class="grid">
          <div>
            <label>Assigned case worker</label>
            <select name="caseWorkerId">
              <option value="">Unassigned</option>
            </select>
          </div>
        </div>
      </div>

      <div id="form-message" class="message" role="status" hidden></div>

      <div class="actions">
        <a class="btn-secondary" href="PatientList.html">Cancel</a>
        <button type="submit" class="btn-primary" id="submitBtn">Save Patient</button>
      </div>
    </form>
  </div>
  <script>
/**
 * Patient – API integration
 * Endpoints used:
 *   POST   /api/patients
 *   GET    /api/patients/{id}
 *   GET    /api/patients/number/{patientNumber}
 *   PUT    /api/patients/{id}
 *   DELETE /api/patients/{id}
 *
 * Open this page as Patient.html?id=<patient id> to view and update a patient.
 * Without an id it creates a new patient.
 */

// Same origin as the app, like the patient list. Login is a cookie the browser sends itself.
const API_BASE = '/api';
const LOGIN_PAGE = '/Login.html';
const PHONE_PATTERN = '\\+?[0-9 \\(\\)\\-]{7,20}';

async function api(method, path, body) {
  let res;
  try {
    res = await fetch(`${API_BASE}${path}`, {
      method,
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: body ? JSON.stringify(body) : undefined
    });
  } catch (e) {
    throw new Error("Can't reach the server. Check that the app is running.");
  }

  if (res.status === 401) {
    window.location.href = LOGIN_PAGE;
    throw new Error('Your session has ended. Please sign in again.');
  }
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(describeError(err, res));
  }
  if (res.status === 204) return null;
  return res.json();
}

// "nextOfKin[0].relationshipToPatient" -> "Relationship to patient"
function fieldLabel(path) {
  const last = String(path).replace(/\[\d+\]/g, '').split('.').pop();
  const words = last.replace(/([A-Z])/g, ' $1').toLowerCase();
  return words.charAt(0).toUpperCase() + words.slice(1);
}

function describeError(err, res) {
  const fields = Object.entries((err && err.errors) || {})
    .map(([field, message]) => `${fieldLabel(field)}: ${message}`);
  const base = (err && (err.detail || err.message || err.error)) || res.statusText || `HTTP ${res.status}`;
  return fields.length ? `${base}. ${fields.join('; ')}` : base;
}

// ─────────────────────────────────────────────
// Next of kin cards (add and remove as many as needed)
// ─────────────────────────────────────────────
const NOK_TEXT_FIELDS = [
  'fullName', 'relationshipToPatient', 'phoneNumber',
  'alternativePhoneNumber', 'email', 'address'
];

let uid = 0;

// Lets a click on a label focus its field, and lets screen readers read them together.
function linkLabels(root) {
  root.querySelectorAll('label:not(.check)').forEach(label => {
    const control = label.nextElementSibling;
    if (control && /^(INPUT|SELECT|TEXTAREA)$/.test(control.tagName)) {
      if (!control.id) control.id = `field-${++uid}`;
      label.htmlFor = control.id;
    }
  });
}

function renumberNok() {
  document.querySelectorAll('#nokList .nok-card h3').forEach((h, i) => {
    h.textContent = `Contact ${i + 1}`;
  });
}

function addNok(kin = {}) {
  const card = document.createElement('div');
  card.className = 'nok-card';
  card.innerHTML = `
    <div class="nok-head">
      <h3></h3>
      <button type="button" class="nok-remove">Remove</button>
    </div>
    <div class="grid">
      <div>
        <label>Full Name</label>
        <input type="text" data-f="fullName" maxlength="150">
      </div>
      <div>
        <label>Relationship</label>
        <input type="text" data-f="relationshipToPatient" maxlength="50">
      </div>
      <div>
        <label>Phone</label>
        <input type="tel" data-f="phoneNumber" maxlength="20">
      </div>
      <div>
        <label>Alternative Phone</label>
        <input type="tel" data-f="alternativePhoneNumber" maxlength="20">
      </div>
      <div>
        <label>Email</label>
        <input type="email" data-f="email" maxlength="150">
      </div>
      <div>
        <label>Address</label>
        <input type="text" data-f="address" maxlength="300">
      </div>
      <div class="full">
        <label class="check">
          <input type="checkbox" data-f="authorizedToReceiveInformation">
          This person can receive information about the patient
        </label>
      </div>
    </div>`;

  // Values are set as properties, never as HTML.
  NOK_TEXT_FIELDS.forEach(f => {
    const input = card.querySelector(`[data-f="${f}"]`);
    if (kin[f] != null) input.value = kin[f];
    if (f === 'phoneNumber' || f === 'alternativePhoneNumber') {
      input.setAttribute('pattern', PHONE_PATTERN);
      input.title = '7 to 20 digits. Spaces, brackets and hyphens are fine, and a leading + is allowed.';
    }
  });
  card.querySelector('[data-f="authorizedToReceiveInformation"]').checked =
    kin.authorizedToReceiveInformation === true;

  card.querySelector('.nok-remove').addEventListener('click', () => {
    card.remove();
    renumberNok();
  });

  linkLabels(card);
  document.getElementById('nokList').append(card);
  renumberNok();
}

// Sends every field the server stores, so an update never blanks a field the page doesn't show.
function collectNextOfKin() {
  const kin = [];
  document.querySelectorAll('#nokList .nok-card').forEach((card, i) => {
    const get = f => card.querySelector(`[data-f="${f}"]`).value.trim() || null;
    const authorized = card.querySelector('[data-f="authorizedToReceiveInformation"]').checked;

    const entry = {
      fullName: get('fullName'),
      relationshipToPatient: get('relationshipToPatient'),
      phoneNumber: get('phoneNumber'),
      alternativePhoneNumber: get('alternativePhoneNumber'),
      address: get('address'),
      email: get('email'),
      authorizedToReceiveInformation: authorized
    };

    const empty = !authorized && NOK_TEXT_FIELDS.every(f => !entry[f]);
    if (empty) return; // a blank card is ignored

    if (!entry.fullName || !entry.relationshipToPatient || !entry.phoneNumber) {
      throw new Error(`Contact ${i + 1} needs a name, a relationship and a phone number. Fill them in or remove the contact.`);
    }
    kin.push(entry);
  });
  return kin;
}

// ─────────────────────────────────────────────
// Collect form → PatientRequest shape
// ─────────────────────────────────────────────
function val(name) {
  const el = document.querySelector(`[name="${name}"]`);
  return el ? (el.value.trim() || null) : null;
}

function collectPatient() {
  return {
    fullName: val('fullName'),
    previousName: val('previousName'),
    dateOfBirth: val('dateOfBirth'),          // "YYYY-MM-DD"
    sex: val('sex'),
    nationality: val('nationality'),
    stateOfOrigin: val('stateOfOrigin'),
    maritalStatus: val('maritalStatus'),
    occupation: val('occupation'),
    educationLevel: val('educationLevel'),
    residentialAddress: val('residentialAddress'),
    phoneNumber: val('phoneNumber'),
    emailAddress: val('emailAddress'),
    preferredLanguage: val('preferredLanguage'),
    preferredCommunicationMethod: val('preferredCommunicationMethod'),
    nextOfKin: collectNextOfKin()
  };
}

// ─────────────────────────────────────────────
// CRUD actions
// ─────────────────────────────────────────────
const createPatient = body => api('POST', '/patients', body);
const updatePatient = (id, body) => api('PUT', `/patients/${encodeURIComponent(id)}`, body);
const getPatient = id => api('GET', `/patients/${encodeURIComponent(id)}`);
const getPatientByNumber = number => api('GET', `/patients/number/${encodeURIComponent(number)}`);
const deletePatient = id => api('DELETE', `/patients/${encodeURIComponent(id)}`);
const assignCaseWorker = (id, caseWorkerId) =>
  api('PUT', `/patients/${encodeURIComponent(id)}/case-worker`, { caseWorkerId });

// Admins can choose the case worker. Staff never see the section, and the server rejects them anyway.
let isAdmin = false;

async function setupCaseWorker() {
  try {
    const me = await api('GET', '/access/me');
    isAdmin = !!(me && me.admin);
    if (!isAdmin) return;
    const select = document.querySelector('[name="caseWorkerId"]');
    const people = await api('GET', '/users/case-workers');
    people.forEach(u => select.append(new Option(u.name, String(u.id))));
    document.getElementById('caseWorkerSection').hidden = false;
  } catch (e) {
    isAdmin = false;   // the section stays hidden; everything else still works
  }
}

function chosenCaseWorkerId() {
  const v = document.querySelector('[name="caseWorkerId"]').value;
  return v ? Number(v) : null;
}

// ─────────────────────────────────────────────
// Populate form from PatientResponse
// ─────────────────────────────────────────────
function prettify(value) {
  const s = String(value).toLowerCase().replace(/_/g, ' ');
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function set(name, value) {
  const el = document.querySelector(`[name="${name}"]`);
  if (!el || value == null) return;
  // A value the list doesn't offer is kept, so saving never silently clears it.
  if (el.tagName === 'SELECT' && ![...el.options].some(o => o.value === value)) {
    el.append(new Option(prettify(value), value));
  }
  el.value = value;
}

function populatePatientForm(data) {
  if (!data) return;

  set('fullName', data.fullName);
  set('previousName', data.previousName);
  set('dateOfBirth', data.dateOfBirth);               // expects "YYYY-MM-DD"
  set('sex', data.sex);
  set('nationality', data.nationality);
  set('stateOfOrigin', data.stateOfOrigin);
  set('maritalStatus', data.maritalStatus);
  set('occupation', data.occupation);
  set('educationLevel', data.educationLevel);
  set('residentialAddress', data.residentialAddress);
  set('phoneNumber', data.phoneNumber);
  set('emailAddress', data.emailAddress);
  set('preferredLanguage', data.preferredLanguage);
  set('preferredCommunicationMethod', data.preferredCommunicationMethod);
  if (isAdmin) {
    const select = document.querySelector('[name="caseWorkerId"]');
    // A case worker the list doesn't offer is kept, so saving never silently clears it.
    if (data.caseWorkerId != null && ![...select.options].some(o => o.value === String(data.caseWorkerId))) {
      select.append(new Option(data.caseWorkerName || `User ${data.caseWorkerId}`, String(data.caseWorkerId)));
    }
    select.value = data.caseWorkerId != null ? String(data.caseWorkerId) : '';
  }

  // Next of kin: one card each, and an empty card if there are none yet.
  document.getElementById('nokList').replaceChildren();
  const list = data.nextOfKin || [];
  if (list.length) list.forEach(addNok); else addNok();

  showHeader(data);
}

// "{name} information" in the header, with the number and age beneath it.
function showHeader(data) {
  if (data.fullName) {
    const title = `${data.fullName} information`;
    document.getElementById('pageTitle').textContent = title;
    document.title = title;
  }
  document.getElementById('patientNumber').textContent = data.patientNumber || '';
  document.getElementById('patientAge').textContent = data.age != null ? data.age : '';
  document.getElementById('patientMeta').hidden = !data.patientNumber;
}

// ─────────────────────────────────────────────
// UI helpers
// ─────────────────────────────────────────────
function showMessage(el, text, isError = false) {
  el.textContent = text;
  el.className = 'message ' + (isError ? 'error' : 'ok');
  el.setAttribute('role', isError ? 'alert' : 'status');
  el.hidden = false;
}

function hideMessage(el) {
  el.hidden = true;
  el.textContent = '';
}

// ─────────────────────────────────────────────
// Wire up the form
// ─────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(location.search);
  const idParam = params.get('id');             // ?id=<uuid>
  const numberParam = params.get('number');     // ?number=PT-2026-XXXX

  const form = document.getElementById('patientForm');
  const submitBtn = document.getElementById('submitBtn');
  const loadMsg = document.getElementById('load-message');
  const formMsg = document.getElementById('form-message');

  let currentId = null;                         // set once a patient is loaded or created

  linkLabels(document);
  document.getElementById('addNok').addEventListener('click', () => addNok());
  await setupCaseWorker();

  if (idParam || numberParam) {
    // Existing patient: the button updates, and stays off until the details have loaded.
    submitBtn.textContent = 'Update';
    submitBtn.disabled = true;
    try {
      const data = idParam ? await getPatient(idParam) : await getPatientByNumber(numberParam);
      currentId = data.id;
      populatePatientForm(data);
      submitBtn.disabled = false;
    } catch (e) {
      showMessage(loadMsg, 'Failed to load patient: ' + e.message, true);
    }
  } else {
    document.getElementById('pageTitle').textContent = 'New patient';
    document.title = 'New patient';
    addNok();
    addNok();
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMessage(formMsg);

    const isDelete = e.submitter?.dataset?.action === 'delete';
    const editing = !!currentId;
    const idleText = submitBtn.textContent;

    try {
      if (isDelete) {
        if (!currentId) throw new Error('No patient ID to delete');
        if (!confirm('Delete this patient permanently?')) return;
        await deletePatient(currentId);
        window.location.href = 'PatientList.html';
        return;
      }

      const body = collectPatient();
      submitBtn.disabled = true;
      submitBtn.textContent = editing ? 'Updating…' : 'Saving…';

      const caseWorkerId = isAdmin ? chosenCaseWorkerId() : null;

      if (editing) {
        let saved = await updatePatient(currentId, body);
        if (isAdmin) saved = await assignCaseWorker(currentId, caseWorkerId);
        populatePatientForm(saved);               // show exactly what the server stored
        showMessage(formMsg, 'Patient updated successfully');
      } else {
        let saved = await createPatient(body);
        currentId = saved.id;
        history.replaceState(null, '', `?id=${encodeURIComponent(saved.id)}`);
        if (isAdmin) saved = await assignCaseWorker(saved.id, caseWorkerId);
        populatePatientForm(saved);
        submitBtn.textContent = 'Update';
        showMessage(formMsg, 'Patient created successfully');
      }
    } catch (err) {
      showMessage(formMsg, err.message, true);
      formMsg.scrollIntoView({ block: 'nearest' });
    } finally {
      submitBtn.disabled = false;
      if (submitBtn.textContent.endsWith('…')) submitBtn.textContent = idleText;
      else if (currentId) submitBtn.textContent = 'Update';
    }
  });
});
</script>
</body>
</html>
