
spring:
  application:
    name: market

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/market}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: [openid, email, profile]

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

app:
  frontend-url: ${FRONTEND_URL:https://www.senami.com}
  security:
    password-reset-expiry-minutes: 60
  mail:
    from-address: ${MAIL_USERNAME:}
    enabled: true
  file-limit:
    free: 1
    paid: 10

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework   # needed behind Render's HTTPS proxy, or OAuth redirect URLs come out as http://
  tomcat:
    max-http-form-post-size: -1
    max-swallow-size: -1

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO