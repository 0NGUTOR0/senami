<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patients</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Header */
    .topbar {
      background: #1e3a5f;
      color: #fff;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: nowrap;   /* logo and user menu always share one row */
    }
    .topbar h1 { font-size: 1.35rem; font-weight: 600; }
    .topbar-actions { display: flex; gap: .75rem; align-items: center; margin-right: 90px; min-width: 0; }
    [hidden] { display: none !important; }
    .btn {
      padding: .55rem 1.1rem;
      border-radius: 6px;
      font-size: .9rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: .4rem;
    }
    .btn-primary { background: #3182ce; color: #fff; }
    .btn-primary:hover { background: #2b6cb0; }
    .btn-ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4);font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .btn-ghost:hover { background: rgba(255,255,255,.1); }
    .logo{
      height: 60px;
      width: auto;
      margin-left: 90px;
      flex: none;
    }

    /* Current user, next to the profile icon */
    .user-menu { position: relative; min-width: 0; }
    .user {
      display: flex;
      align-items: center;
      gap: .65rem;
      min-width: 0;
      padding: .3rem .6rem .3rem .3rem;
      width: 100%;   /* lets the button shrink with its container instead of keeping its text width */
      max-width: 100%;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .user:hover, .user[aria-expanded="true"] { background: rgba(255,255,255,.12); }
    .user:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .user-caret {
      flex: none;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .8;
      transition: transform .15s;
    }
    .user[aria-expanded="true"] .user-caret { transform: rotate(180deg); }

    .menu {
      position: absolute;
      right: 0;
      top: calc(100% + .5rem);
      min-width: 220px;
      background: #fff;
      color: #1a202c;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
      padding: .35rem;
      z-index: 50;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: .6rem;
      width: 100%;
      padding: .6rem .75rem;
      border: 0;
      border-radius: 6px;
      background: none;
      color: inherit;
      font: inherit;
      font-size: .92rem;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
    }
    .menu-item:hover, .menu-item:focus-visible { background: #edf2f7; outline: none; }
    .menu-item svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #4a5568;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .menu-sep { height: 1px; background: #e2e8f0; margin: .3rem .25rem; }
    .menu-item.danger { color: #c53030; }
    .menu-item.danger svg { stroke: #c53030; }

    /* Floating "New Patient" button */
    .fab {
      position: fixed;
      right: 1.5rem;
      bottom: 1.5rem;
      z-index: 40;
      padding: .85rem 1.4rem;
      border-radius: 9px;
      font-size: 1rem;
      box-shadow: 0 6px 20px rgba(30,58,95,.35);
    }
    .fab:hover { box-shadow: 0 8px 24px rgba(30,58,95,.45); }
    .fab:focus-visible { outline: 3px solid #1e3a5f; outline-offset: 3px; }
    .user-icon {
      flex: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,.16);
      display: grid;
      place-items: center;
    }
    .user-icon svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: #fff;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .user-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
    .user-name, .user-email {
      max-width: 15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-name { font-weight: 600; font-size: .95rem; }
    .user-email { font-size: .78rem; opacity: .75; }

    /* Main */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1.5rem 6rem; /* room so the floating button never covers the last row */
    }

    /* Search bar */
    .toolbar {
      display: flex;
      gap: .75rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .search-wrap {
      flex: 1;
      min-width: 220px;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: .65rem 1rem .65rem 2.5rem;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: .95rem;
      background: #fff;
    }
    .search-wrap input:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49,130,206,.15);
    }
    .search-wrap::before {
      content: "🔍";
      position: absolute;
      left: .85rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: .9rem;
      opacity: .5;
    }

    /* Table card */
    
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
      overflow: hidden;
    }
    .link-btn {
      background: none;
      border: none;
      color: #3182ce;
      font-size: .85rem;
      cursor: pointer;
      padding: .4rem .75rem;
      border-radius: 6px;      
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .row-actions { display: flex; align-items: center; justify-content: flex-end; gap: .25rem; padding-right: .75rem; white-space: nowrap; }
    .qr-link {
      flex: none;
      display: inline-grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      color: #1e3a5f;
      font-size: 1.15rem;
      text-decoration: none;
    }
    .qr-link:hover { background: #ebf8ff; color: #3182ce; }
    .qr-link:focus-visible { outline: 3px solid #3182ce; outline-offset: -2px; }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      text-align: left;
      padding: .85rem 1.1rem;
      font-size: .8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .03em;
      color: #718096;
      background: #f7fafc;
      border-bottom: 1px solid #e2e8f0;
    }
    th.col-number { width: 200px; }
    th.col-age { width: 110px; }
    th.col-cw { width: 190px; }
    .cw-text { color: #4a5568; }
    .cw-none { color: #a0aec0; font-style: italic; }
    .cw-line { display: none; font-size: .78rem; color: #718096; margin-top: .1rem; }
    .filter-wrap { display: none; }
    .filter-wrap select {
      padding: .65rem .85rem;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: .95rem;
      background: #fff;
      max-width: 100%;
    }
    .filter-wrap select:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49,130,206,.15);
    }
    td {
      padding: 0;
      border-bottom: 1px solid #edf2f7;
      font-size: .95rem;
    }
    tr:last-child td { border-bottom: none; }

    /* The link fills the whole cell, so a click anywhere on the row opens the patient. */
    .cell-link {
      display: block;
      padding: .9rem 1.1rem;
      color: inherit;
      text-decoration: none;
    }
    tbody tr:hover td,
    tbody tr:focus-within td { background: #ebf8ff; }
    .cell-link:focus-visible { outline: 3px solid #3182ce; outline-offset: -3px; }
    .patient-number {
      font-family: ui-monospace, monospace;
      font-size: .85rem;
      color: #4a5568;
    }
    .name { font-weight: 500; }

    /* Empty / loading / error */
    .state {
      padding: 3rem 1.5rem;
      text-align: center;
      color: #718096;
    }
    .state.error { color: #c53030; }

    /* Pagination */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.1rem;
      border-top: 1px solid #edf2f7;
      font-size: .9rem;
      color: #4a5568;
      flex-wrap: wrap;
      gap: .75rem;
    }
    .page-btns { display: flex; gap: .4rem; }
    .page-btn {
      padding: .4rem .75rem;
      border: 1px solid #e2e8f0;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: .85rem;
    }
    .page-btn:hover:not(:disabled) { background: #edf2f7; }
    .page-btn:disabled { opacity: .4; cursor: not-allowed; }
    .page-btn.active {
      background: #1e3a5f;
      color: #fff;
      border-color: #1e3a5f;
    }

    @media (max-width: 900px) {
      .logo { margin-left: 0; }
      .topbar-actions { margin-right: 0; }
    }

    @media (max-width: 700px) {
      .topbar { padding: .6rem .75rem; gap: .5rem; }
      .logo { height: 40px; }
      .user { gap: .5rem; padding-right: .4rem; }
      .user-icon { width: 36px; height: 36px; }
      .user-name { max-width: 9rem; }
      .fab { right: 1rem; bottom: 1rem; }
      .user-email { display: none; }
      th { padding: .7rem .75rem; }
      .cell-link { padding: .8rem .75rem; }
      table { table-layout: fixed; }
      th.col-number { width: 24%; }
      th.col-actions { width: 118px; }
      th.col-cw, td.cw-cell { display: none; }          /* on phones the case worker shows under the name instead */
      .cw-line { display: block; }
      .name .cell-link { overflow-wrap: anywhere; }
      th.col-age { width: 70px; }
      .patient-number { font-size: .75rem; overflow-wrap: anywhere; }
      th.col-age, td.age-cell { display: none; }   /* age is hidden on phones so the row actions stay visible */
      .link-btn { padding: .4rem .4rem; }
      .link-btn .long { display: none; }
      .row-actions { padding-right: .25rem; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <img class="logo" src="/Images/Logo.png" alt="Logo">
    <div class="topbar-actions">
      <div class="user-menu" id="userMenu" hidden>
        <button type="button" class="user" id="userBox"
                aria-haspopup="menu" aria-expanded="false" aria-controls="userDropdown">
          <span class="user-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
          </span>
          <span class="user-text">
            <span class="user-name" id="userName"></span>
            <span class="user-email" id="userEmail"></span>
          </span>
          <svg class="user-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
        <div class="menu" id="userDropdown" role="menu" aria-labelledby="userBox" hidden>
          <a class="menu-item" role="menuitem" href="AccountSettings.html" id="accountLink">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
            Account settings
          </a>
          <div class="menu-sep" role="separator"></div>
          <button type="button" class="menu-item danger" role="menuitem" onclick="logout()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
            Logout
          </button>
        </div>
      </div>
    </div>
  </header>

  <a href="Patient.html" class="btn btn-primary fab" id="newPatientBtn">+ New Patient</a>

  <main class="container">
    <div class="toolbar">
      <div class="search-wrap">
        <input type="search" id="searchInput" placeholder="Search by name or patient number…" autocomplete="off">
      </div>
      <div class="filter-wrap" id="filterWrap">
        <select id="caseWorkerFilter" aria-label="Filter by case worker">
          <option value="">All case workers</option>
          <option value="unassigned">Unassigned</option>
        </select>
      </div>
    </div>

    <div class="card">
      <div id="content">
        <div class="state">Loading patients…</div>
      </div>
    </div>
  </main>


<script>
    const API = '/api';

    // Page that opens when a row is clicked. It receives ?id=<patient id>.
    const PATIENT_PAGE = 'Patient.html';

    let currentPage = 0;
    let totalPages = 0;
    let searchQuery = '';
    let searchTimeout = null;
    let caseWorkerFilter = '';
    let isAdmin = false;

    // Cookies are HTTP-only, so JavaScript must not read the JWT.
    function authHeaders() {
        return {
            'Content-Type': 'application/json'
        };
    }

    // Log out and clear authentication cookies on the server.
    async function logout() {
        try {
            await fetch('/auth/logout', {
                method: 'POST',
                credentials: 'include'
            });
        } catch (error) {
            console.error('Logout request failed:', error);
        } finally {
            window.location.href = '/index.html';
        }
    }

    // Verify the user's authentication cookie.
    // Returns the signed-in user (an object) or null when the check fails.
    async function checkAuthentication() {
        try {
            const response = await fetch('/auth/me', {
                method: 'GET',
                credentials: 'include'
            });

            if (!response.ok) {
                window.location.href = '/index.html';
                return null;
            }

            const data = await response.json().catch(() => null);
            return data || {};

        } catch (error) {
            console.error('Authentication check failed:', error);

            document.getElementById('content').innerHTML =
                '<div class="state error">' +
                'Unable to verify your login. Please check your connection and try again.' +
                '</div>';

            return null;
        }
    }

    // Show who is signed in, next to the profile icon.
    function renderUser(data) {
        const user = (data && (data.user || data.data)) || data || {};

        const email = user.email || '';
        const fullName = [user.firstName, user.lastName].filter(Boolean).join(' ');
        let name =
            user.fullName ||
            user.name ||
            fullName ||
            user.username ||
            '';
        if (name === email) name = '';   // a name that is just the email would show it twice

        // Only ever the full name and the email. With no name, the email takes the top line.
        const nameEl = document.getElementById('userName');
        const emailEl = document.getElementById('userEmail');

        nameEl.textContent = name || email;
        emailEl.textContent = name ? email : '';
        document.getElementById('userBox').title = [name, email].filter(Boolean).join(' · ');
        document.getElementById('userMenu').hidden = false;
    }

    // Dropdown under the profile icon: account settings and logout.
    (function setupUserMenu() {
        const wrap = document.getElementById('userMenu');
        const button = document.getElementById('userBox');
        const menu = document.getElementById('userDropdown');

        function items() {
            return [...menu.querySelectorAll('[role="menuitem"]')];
        }
        function open(focusFirst) {
            menu.hidden = false;
            button.setAttribute('aria-expanded', 'true');
            if (focusFirst) items()[0]?.focus();
        }
        function close(returnFocus) {
            menu.hidden = true;
            button.setAttribute('aria-expanded', 'false');
            if (returnFocus) button.focus();
        }

        button.addEventListener('click', () => (menu.hidden ? open(false) : close(false)));
        button.addEventListener('keydown', event => {
            if (event.key === 'ArrowDown') { event.preventDefault(); open(true); }
        });

        menu.addEventListener('keydown', event => {
            const list = items();
            const i = list.indexOf(document.activeElement);
            if (event.key === 'ArrowDown') { event.preventDefault(); list[(i + 1) % list.length].focus(); }
            else if (event.key === 'ArrowUp') { event.preventDefault(); list[(i - 1 + list.length) % list.length].focus(); }
            else if (event.key === 'Home') { event.preventDefault(); list[0].focus(); }
            else if (event.key === 'End') { event.preventDefault(); list[list.length - 1].focus(); }
            else if (event.key === 'Tab') { close(false); }
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && !menu.hidden) close(true);
        });
        document.addEventListener('click', event => {
            if (!menu.hidden && !wrap.contains(event.target)) close(false);
        });
    })();

    // Load patients from the backend.
    async function loadPatients(page = 0) {
        currentPage = page;

        const params = new URLSearchParams({
            page: String(page),
            size: '15',
            sort: 'fullName,asc'
        });

        if (searchQuery) {
            params.set('q', searchQuery);
        }
        if (isAdmin && caseWorkerFilter) {
            params.set('caseWorker', caseWorkerFilter);
        }

        const container = document.getElementById('content');
        container.innerHTML =
            '<div class="state">Loading patients…</div>';

        try {
            const response = await fetch(
                `${API}/patients?${params.toString()}`,
                {
                    method: 'GET',
                    headers: authHeaders(),
                    credentials: 'include'
                }
            );

            if (response.status === 401) {
                window.location.href = '/index.html';
                return;
            }

            if (!response.ok) {
                throw new Error(
                    `Failed to load patients (${response.status})`
                );
            }

            const data = await response.json();

            totalPages = data.totalPages || 0;

            renderTable(data);

        } catch (error) {
            console.error('Error loading patients:', error);

            container.innerHTML =
                `<div class="state error">${escapeHtml(error.message)}</div>`;
        }
    }

    // Render the patient table: number, name and age. Every cell links to the patient.
    function renderTable(page) {
        const patients = page.content || [];
        const container = document.getElementById('content');

        if (patients.length === 0) {
            container.innerHTML = `
                <div class="state">
                    ${searchQuery || caseWorkerFilter
                        ? 'No patients match your search.'
                        : (isAdmin ? 'No patients yet.' : 'No patients are assigned to you yet.')}
                    <br><br>
                    <a href="Patient.html" class="btn btn-primary">
                        ${searchQuery || caseWorkerFilter ? 'Add a patient' : 'Add first patient'}
                    </a>
                </div>`;
            return;
        }

        const rows = patients.map(patient => {
            const href = escapeHtml(
                `${PATIENT_PAGE}?id=${encodeURIComponent(patient.id)}`
            );

            // Only the name link is focusable, so keyboard users get one stop per row.
            return `
            <tr>
                <td class="patient-number">
                    <a class="cell-link" href="${href}" tabindex="-1" aria-hidden="true">
                        ${escapeHtml(patient.patientNumber || '—')}
                    </a>
                </td>

                <td class="name">
                    <a class="cell-link" href="${href}">
                        ${escapeHtml(patient.fullName || '—')}
                        ${isAdmin ? `<div class="cw-line">${caseWorkerText(patient)}</div>` : ''}
                    </a>
                </td>

                <td class="age-cell">
                    <a class="cell-link" href="${href}" tabindex="-1" aria-hidden="true">
                        ${patient.age != null
                            ? escapeHtml(patient.age)
                            : '—'}
                    </a>
                </td>

                ${isAdmin ? `
                <td class="cw-cell">
                    <a class="cell-link" href="${href}" tabindex="-1" aria-hidden="true">
                        ${caseWorkerText(patient)}
                    </a>
                </td>` : ''}

                <td class="actions-cell">
                    <div class="row-actions">
                        <button class="link-btn"
                            onclick="AllPatientIncidents('${escapeHtml(patient.id)}')">
                            Incidents<span class="long"> &amp; Consumption</span>
                        </button>
                        <a class="qr-link"
                           href="PatientQr.html?id=${encodeURIComponent(patient.id)}"
                           title="QR code for ${escapeHtml(patient.fullName || 'this patient')}"
                           aria-label="QR code for ${escapeHtml(patient.fullName || 'this patient')}">
                            <i class="fa-solid fa-qrcode" aria-hidden="true"></i>
                        </a>
                    </div>
                </td>
            </tr>
        `;
        }).join('');

        container.innerHTML = `
            <table>

            <thead>
                <tr>
                    <th class="col-number">Number</th>
                    <th>Name</th>
                    <th class="col-age">Age</th>
                    ${isAdmin ? '<th class="col-cw">Case worker</th>' : ''}
                    <th class="col-actions"></th>
                </tr>
            </thead>


                <tbody>${rows}</tbody>
            </table>

            ${renderPagination(page)}
        `;
    }

    // The case worker's name, or a grey "Unassigned".
    function caseWorkerText(patient) {
        return patient.caseWorkerName
            ? `<span class="cw-text">${escapeHtml(patient.caseWorkerName)}</span>`
            : '<span class="cw-none">Unassigned</span>';
    }

    // Admins get the case worker column and filter. Staff only ever see their own patients.
    async function setupRole() {
        try {
            const res = await fetch(`${API}/access/me`, { credentials: 'include', headers: { 'Accept': 'application/json' } });
            if (!res.ok) return;
            const me = await res.json();
            isAdmin = me.admin === true;
        } catch (e) {
            console.error('Could not check the role:', e);
        }
        if (!isAdmin) return;

        try {
            const res = await fetch(`${API}/users/case-workers`, { credentials: 'include', headers: { 'Accept': 'application/json' } });
            if (res.ok) {
                const select = document.getElementById('caseWorkerFilter');
                (await res.json()).forEach(u => {
                    const o = document.createElement('option');
                    o.value = String(u.id);
                    o.textContent = u.name;
                    select.append(o);
                });
            }
        } catch (e) {
            console.error('Could not load case workers:', e);
        }
        document.getElementById('filterWrap').style.display = 'block';
    }

    document.getElementById('caseWorkerFilter').addEventListener('change', event => {
        caseWorkerFilter = event.target.value;
        loadPatients(0);
    });

    // Render pagination controls.
    function renderPagination(page) {
        if (page.totalPages <= 1) {
            return '';
        }

        const from = page.number * page.size + 1;

        const to = Math.min(
            (page.number + 1) * page.size,
            page.totalElements
        );

        let buttons = '';

        buttons += `
            <button class="page-btn"
                ${page.first ? 'disabled' : ''}
                onclick="loadPatients(${page.number - 1})">
                Prev
            </button>
        `;

        const start = Math.max(0, page.number - 2);
        const end = Math.min(page.totalPages - 1, page.number + 2);

        for (let i = start; i <= end; i++) {
            buttons += `
                <button class="page-btn ${i === page.number ? 'active' : ''}"
                    onclick="loadPatients(${i})">
                    ${i + 1}
                </button>
            `;
        }

        buttons += `
            <button class="page-btn"
                ${page.last ? 'disabled' : ''}
                onclick="loadPatients(${page.number + 1})">
                Next
            </button>
        `;

        return `
            <div class="pagination">
                <span>
                    Showing ${from}–${to} of ${page.totalElements}
                </span>

                <div class="page-btns">
                    ${buttons}
                </div>
            </div>
        `;
    }

    function AllPatientIncidents(id) {
        window.location.href =
            `IncidentAnalyticsDashboard.html?patientId=${encodeURIComponent(id)}`;
    }

    // Escape HTML characters before displaying text.
    function escapeHtml(value) {
        if (value == null) {
            return '';
        }

        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // Debounced patient search.
    document.getElementById('searchInput')
        .addEventListener('input', event => {
            clearTimeout(searchTimeout);

            searchTimeout = setTimeout(() => {
                searchQuery = event.target.value.trim();
                loadPatients(0);
            }, 350);
        });

    // Authenticate first, then show the user and load the patient list.
    (async function init() {
        const user = await checkAuthentication();

        if (user) {
            renderUser(user);
            await setupRole();
            await loadPatients(0);
        }
    })();
</script>
